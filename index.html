<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mini Social</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1 class="logo">Mini Social</h1>
</header>

<main class="feed">

  <article class="post">
    <div class="post-header">
      <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQ5kvBL0aHozHoLdO5pGMCWbWmKBL8ZdMh3w&s
      <div>
        <span class="name">Nickinhas_dumall</span>
        <span class="username">@nicolascode</span>
      </div>
    </div>

    <p class="post-text">
      BOM DIA COM JESUS TROPA Da congada👹🚀
    </p>

    <div class="post-actions">
      <button id="likeBtn">Curtir</button>
      <button id="deslikeBtn">descurtir</button>
      <span id="likeCount">0</span>
      <span id="deslikeCount">0</span>
  
      
      
    </div>

    <section class="comments">
      <div class="comment">
        <img src="assets/avatar.png" class="avatar-small">
        <p>Aki soa o bigode, boi da coice e fura tambor</p>
      </div>

      <div class="comment">
        <img src="assets/avatar.png" class="avatar-small">
        <p>tropa PUIUNA, menor do Congo *-* </p>
      </div>
    </section>

  </article>

</main>

<script src="js/script.js"></script>
</body>
</html>
